; Rev A bring-up test for the analogue board's Teensy 4.1 build (teensy_core_midi).
; One serial command per block of docs/analogue_board_bringup.md stage 6.
;
;   pio run -t upload        flash, in the foreground (a background upload once bricked a module)
;   pio device monitor       then type a block number and Enter; h lists them

[env:teensy41]
platform        = teensy @ ~5.1.0
board           = teensy41
framework       = arduino
; the Teensy Loader app (arm64) rather than teensy-cli, whose teensy_loader_cli is x86_64 only
upload_protocol = teensy-gui
build_flags     = -D USB_SERIAL
extra_scripts   = post:arm64_toolchain.py
monitor_speed   = 115200
monitor_echo    = yes
monitor_eol     = LF
