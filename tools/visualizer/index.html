<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>n8synth Breadboard Visualizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { color-scheme: dark; --page:#1a1a19; --ink:#e8e8e2; --ink-2:#c3c2b7;
        --side:#232326; --panel:#2b2b2f; --edge:#44444a; --accent:#4a9; --field:#1e1e21;
        --heading:#7cc4f0; --test:#f0b44c; --parts:#b9c0c8; --sname:#d5dde4; --scount:#8f97a0;
        --active-bg:#1a3a2e; --active-ink:#ffffff; --tip-bg:#2b2b2f; --tip-ink:#e8e8e2; }
    :root[data-theme="light"] { color-scheme: light; --page:#e8e8e4; --ink:#0b0b0b; --ink-2:#52514e;
        --side:#e6e6e1; --panel:#dcdcd6; --edge:#b9b9b1; --accent:#1a7f5a; --field:#fbfbf8;
        --heading:#14507a; --test:#7a4a00; --parts:#3f4a54; --sname:#22303c; --scount:#515b66;
        --active-bg:#cfe6da; --active-ink:#0b0b0b; --tip-bg:#ffffff; --tip-ink:#0b0b0b; }
    body { font-family: 'Consolas', 'Monaco', monospace; background: var(--page); color: var(--ink); display: flex; height: 100vh; }
#sidebar { width: 280px; min-width: 280px; background: var(--side); border-right: 1px solid var(--edge); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
#sidebar h1 { font-size: 13px; color: var(--heading); padding-bottom: 6px; border-bottom: 1px solid var(--edge); }
#file-select { width: 100%; padding: 5px; background: var(--field); color: var(--ink); border: 1px solid var(--edge); border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer; }
#file-select:hover { border-color: var(--accent); }
.stage-btn { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--edge); border-radius: 4px; background: var(--field); color: var(--ink); cursor: pointer; font-family: inherit; font-size: 11px; line-height: 1.4; transition: all 0.15s; }
.stage-btn:hover { border-color: var(--accent); }
.stage-btn.active { background: var(--active-bg); border-color: var(--accent); color: var(--active-ink); }
.stage-btn.completed { border-left: 3px solid var(--accent); }
.stage-btn .snum { color: var(--heading); font-weight: bold; font-size: 12px; }
.stage-btn .sname { color: var(--sname); }
.stage-btn .scount { color: var(--scount); font-size: 10px; }
#stage-info { background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 8px; font-size: 11px; line-height: 1.5; }
#stage-info h3 { color: var(--heading); margin-bottom: 4px; font-size: 12px; }
#stage-info .test-point { color: var(--test); margin-top: 4px; }
#stage-info .parts-list { color: var(--parts); margin-top: 4px; }
#controls { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; padding-top: 6px; border-top: 1px solid var(--edge); }
#controls label { cursor: pointer; }
.legend-note { flex-basis: 100%; color: var(--scount); font-size: 9px; line-height: 1.4; margin-top: 2px; }
    #legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 10px; padding-top: 6px; border-top: 1px solid var(--edge); }
.legend-item { display: flex; align-items: center; gap: 3px; }
.legend-swatch { width: 12px; height: 8px; border-radius: 2px; border: 1px solid var(--edge); }
#main { flex: 1; overflow: auto; background: var(--page); }
svg { display: block; }
#tooltip { position: fixed; pointer-events: none; background: var(--tip-bg); border: 1px solid var(--accent); color: var(--tip-ink); padding: 6px 10px; border-radius: 4px; font-size: 11px; line-height: 1.5; display: none; z-index: 100; max-width: 280px; }
#tooltip .tt-id { color: var(--heading); font-weight: bold; }
#tooltip .tt-val { color: var(--test); }
#tooltip .tt-net { color: var(--accent); }
#tooltip .tt-stage { color: var(--scount); font-size: 10px; }
.comp-group { cursor: pointer; }
.comp-group:hover .comp-body { filter: brightness(1.4); }
.comp-group.dimmed { opacity: 0.08; pointer-events: none; }
.comp-group.prior { opacity: 0.35; }
.comp-group.current .comp-body { filter: brightness(1.1); }
.comp-group.highlighted .comp-body { filter: brightness(1.5); stroke-width: 2; }
#drop-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,50,80,0.85); z-index: 200; justify-content: center; align-items: center; font-size: 20px; color: #4a9; }
#drop-overlay.active { display: flex; }
</style>
</head>
<body>

<div id="sidebar">
  <h1 id="title">n8synth Breadboard Visualizer</h1>
  <select id="file-select"><option value="">-- Load a layout --</option></select>
  <div id="stage-buttons"></div>
  <div id="stage-info"></div>
  <div id="controls">
    <label><input type="checkbox" id="showNets" checked> Nets</label>
    <label><input type="checkbox" id="showValues" checked> Values</label>
    <label><input type="checkbox" id="lightMode"> Light</label>
    <label><input type="checkbox" id="showJPS" checked> JPS</label>
    <label><input type="checkbox" id="showAll"> All stages</label>
  </div>
  <div id="legend"></div>
</div>

<div id="main"><svg id="board"></svg></div>
<div id="tooltip"></div>
<div id="drop-overlay">Drop .json layout file here</div>

<script>
// ============================================================
// GRID (n8synth standard — shared by all layouts)
// ============================================================
const P = 24;
// Edge connectors are DOUBLETS: two joined holes per position (outer = nearer the
// board edge, carries the control-deck link; inner = free on a single-board module).
// Main area exists for rows 1-36 on a powered board; edge connector and power rail
// run 1-40. See docs/n8synth_platform.md.
const COLS = { ctrlLo: 34, ctrlLi: 52, pwrL: 70, a: 116, b: 140, c: 164, d: 188, e: 212,
               f: 262, g: 286, h: 310, i: 334, j: 358, pwrR: 404, ctrlRi: 422, ctrlRo: 440 };
COLS.ctrlL = COLS.ctrlLo; COLS.ctrlR = COLS.ctrlRo;   // bare = hole unspecified -> draw outer
// Legacy aliases for old layouts that still use +12v/gndL/gndR/-12v column names
COLS['+12v'] = COLS.pwrL; COLS['gndL'] = COLS.pwrL; COLS['gndR'] = COLS.pwrR; COLS['-12v'] = COLS.pwrR;
const rowY = r => 56 + (r - 1) * P;
const colX = c => COLS[c];
// One standard for all net labels. DY is measured, not eyeballed: the half-row bar
// runs y-5..y+5 and the cap height at 6.5px is ~4.7px, so a baseline at y+12 puts the
// glyph top 2.3px clear of its own row's bar and 7px short of the next one — still
// visibly closer to the row it belongs to.
const NET_LABEL_SIZE = 6.5, NET_LABEL_DY = 12;
const SVG_W = 476, SVG_H = rowY(40) + 36;
const MAIN_ROWS = 36, CONN_ROWS = 40;   // main area vs edge-connector/rail extent
const RAIL_COLS = ['pwrL', 'pwrR'];
const HOLE_COLS = ['a','b','c','d','e','f','g','h','i','j'];
const RIGHT_COLS = ['f','g','h','i','j'];
// n8synth rail convention: even rows = power (+12V left, -12V right), odd rows = GND
function railColor(col, row) {
  if (col === 'pwrL' || col === '+12v' || col === 'gndL') return (row % 2 === 0) ? TH.pos : TH.gnd;
  if (col === 'pwrR' || col === '-12v' || col === 'gndR') return (row % 2 === 0) ? TH.neg : TH.gnd;
  return TH.labelDim;
}
function railLabel(col, row) {
  if (col === 'pwrL' || col === '+12v' || col === 'gndL') return (row % 2 === 0) ? '+12V' : 'GND';
  if (col === 'pwrR' || col === '-12v' || col === 'gndR') return (row % 2 === 0) ? '-12V' : 'GND';
  return '';
}
// PER-TYPE COLOUR, with honest limits.
//
// Measured with dataviz scripts/validate_palette.js against the surfaces actually
// used (dark #242426, light #f4f4f0):
//   CONTRAST  all 8 hues >= 3:1 in BOTH modes  — this is the non-negotiable one
//   DARK      all five checks PASS
//   LIGHT     one weak adjacent pair: NPN aqua vs PNP yellow, dE 14.2 normal
//             (floor is 15). Relief is in place: every component carries its
//             designator and value as a label, has a distinct shape, and the
//             legend names all eight. Colour reinforces; it never identifies alone.
// Eight hues cannot do better than this — a yellow dark enough for light-mode
// contrast becomes brown and collides with red or green whatever the ordering.
// Re-run the validator for BOTH modes before changing any hue.
const PALETTES = {
  dark: {
    page:'#1a1a19', board:'#242426', boardEdge:'#44444a', halfRow:'#2e2e31',
    hole:'#7a7a82', ctrlFill:'#2b2620', ctrlEdge:'#6a5a3a', ctrlHole:'#c98500',
    ctrlLink:'#8a7340', ctrlLabel:'#d9a441', railFill:'#111', railEdge:'#333',
    ink:'#c3c2b7', inkDim:'#8a8a80', note:'#a89a86',
    labelStrong:'#f2f2ec', labelInk:'#d8d8d0', labelDim:'#9a9a92',
    netInk:'#4fd07a',
    jpsInk:'#f0932b', jpsAlt:'#a8b4c0', markStroke:'#9aa6b4', markAlt:'#e08a30',
    icBody:'#4a4a50', rBody:'#8a6840', cBody:'#2a5a8a',
    pos:'#e66767', neg:'#3987e5', gnd:'#199e70',
    types:{ R:'#d95926', C:'#3987e5', D:'#e66767', IC:'#9085e9',
            NPN:'#199e70', PNP:'#c98500', JW:'#d55181', JPS:'#008300' }
  },
  light: {
    page:'#e8e8e4', board:'#f4f4f0', boardEdge:'#b9b9b1', halfRow:'#e2e2dc',
    hole:'#8d8d85', ctrlFill:'#f3ecdc', ctrlEdge:'#c0ab7e', ctrlHole:'#8a6600',
    ctrlLink:'#b09a5e', ctrlLabel:'#7a5a00', railFill:'#deded8', railEdge:'#b9b9b1',
    ink:'#3a3937', inkDim:'#6f6e6a', note:'#5a544a',
    labelStrong:'#0b0b0b', labelInk:'#2e2d2b', labelDim:'#5f5e5a',
    netInk:'#136b39',
    jpsInk:'#8a4a00', jpsAlt:'#48535e', markStroke:'#59636e', markAlt:'#9c4a00',
    icBody:'#c9c9c3', rBody:'#c8a982', cBody:'#a8c4de',
    pos:'#c62828', neg:'#2a78d6', gnd:'#0f7d57',
    types:{ R:'#c2500f', C:'#2a78d6', D:'#e34948', IC:'#4a3aa7',
            NPN:'#0f7d57', PNP:'#8a6300', JW:'#c14a74', JPS:'#008300' }
  }
};
let THEME = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
let TH = PALETTES[THEME];
const TYPE_COLORS = new Proxy({}, { get: (_, k) => TH.types[k] ||
  ({'+12v':TH.pos,'-12v':TH.neg,gndL:TH.gnd,gndR:TH.gnd,pwrL:TH.pos,pwrR:TH.neg}[k]) || TH.ink });

// ============================================================
// STATE
// ============================================================
let layout = null;   // loaded JSON
let currentStage = 1;
let selectedComp = null;
let compGroups = [];
const svg = document.getElementById('board');
svg.setAttribute('width', SVG_W);
svg.setAttribute('height', SVG_H);
svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);

// ============================================================
// LAYOUT LOADING
// ============================================================
// Registry of built-in layouts (added via <script> tags at bottom of page)
const BUILTIN_LAYOUTS = {};
function registerLayout(name, data) { BUILTIN_LAYOUTS[name] = data; }

function populateSelect() {
  const sel = document.getElementById('file-select');
  Object.keys(BUILTIN_LAYOUTS).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { if (sel.value) loadBuiltinLayout(sel.value); });
}

function loadBuiltinLayout(name) {
  layout = BUILTIN_LAYOUTS[name];
  if (layout) onLayoutLoaded();
}

async function loadLayout(url) {
  try {
    const resp = await fetch(url);
    layout = await resp.json();
    onLayoutLoaded();
  } catch(e) {
    // fetch fails on file:// — try built-in layouts instead
    const name = Object.keys(BUILTIN_LAYOUTS)[0];
    if (name) loadBuiltinLayout(name);
  }
}

function loadLayoutFromJSON(json) {
  try {
    layout = typeof json === 'string' ? JSON.parse(json) : json;
    onLayoutLoaded();
  } catch(e) { alert('Invalid JSON: ' + e.message); }
}

function normalizeLayout() {
  if (!layout) return;
  // Normalize ICs: convert compact format to pin-array format
  if (layout.ics) layout.ics.forEach(ic => {
    if (Array.isArray(ic.pins)) return;
    const n = ic.pins, half = n / 2, topRow = ic.topRow || 4;
    const isRot = ic.rotated || ic.rotation === 180;
    ic.value = ic.value || ic.type || '';
    ic.rotation = isRot ? 180 : 0;
    const generated = [];
    if (isRot) {
      for (let i = 0; i < half; i++) generated.push({ n: half + 1 + i, r: topRow + i, c: 'e' });
      for (let i = 0; i < half; i++) generated.push({ n: half - i, r: topRow + i, c: 'f' });
    } else {
      for (let i = 0; i < half; i++) generated.push({ n: 1 + i, r: topRow + i, c: 'e' });
      for (let i = 0; i < half; i++) generated.push({ n: n - i, r: topRow + i, c: 'f' });
    }
    ic.pins = generated;
  });
  // Normalize transistors: ensure subtype is NPN/PNP, value is part number
  if (layout.transistors) layout.transistors.forEach(t => {
    if (t.type === 'NPN' || t.type === 'PNP') {
      // FM drum format: type=NPN/PNP, subtype=BC548 → swap to match renderer
      const npnpnp = t.type;
      t.value = t.subtype || t.value || npnpnp;
      t.subtype = npnpnp;
    }
  });
}

function onLayoutLoaded() {
  normalizeLayout();
  document.getElementById('title').textContent = layout.title || 'Untitled Layout';
  document.title = (layout.title || 'Layout') + ' — n8synth Visualizer';
  currentStage = layout.stages ? layout.stages.length : 1;
  selectedComp = null;
  buildSidebar();
  render();
}

// Drag and drop JSON files
document.addEventListener('dragover', e => { e.preventDefault(); document.getElementById('drop-overlay').classList.add('active'); });
document.addEventListener('dragleave', e => { if (e.relatedTarget === null) document.getElementById('drop-overlay').classList.remove('active'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file) { const r = new FileReader(); r.onload = () => loadLayoutFromJSON(r.result); r.readAsText(file); }
});

// ============================================================
// SVG HELPERS
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  if (typeof children === 'string') e.textContent = children;
  else if (Array.isArray(children)) children.forEach(c => { if (c) e.appendChild(c); });
  return e;
}

function stageClass(s) {
  if (document.getElementById('showAll').checked) return 'current';
  if (s > currentStage) return 'dimmed';
  if (s === currentStage) return 'current';
  return 'prior';
}

function pinPos(r, c) { return { x: colX(c), y: rowY(r) }; }

function countPartsInStage(stageId) {
  if (!layout) return 0;
  let n = 0;
  if (layout.twoPins)     n += layout.twoPins.filter(c => c.stage === stageId).length;
  if (layout.ics)         n += layout.ics.filter(c => c.stage === stageId).length;
  if (layout.transistors) n += layout.transistors.filter(c => c.stage === stageId).length;
  if (layout.jumpers)     n += layout.jumpers.filter(c => c.stage === stageId).length;
  if (layout.powerWires)  n += layout.powerWires.filter(c => c.stage === stageId).length;
  if (layout.jpsWires)    n += layout.jpsWires.filter(c => c.stage === stageId).length;
  return n;
}

// ============================================================
// SIDEBAR
// ============================================================
function buildSidebar() {
  const container = document.getElementById('stage-buttons');
  container.innerHTML = '';
  if (!layout || !layout.stages) return;
  layout.stages.forEach(s => {
    const count = countPartsInStage(s.id);
    const btn = document.createElement('button');
    btn.className = 'stage-btn' + (s.id === currentStage ? ' active' : '') + (s.id < currentStage ? ' completed' : '');
    btn.innerHTML = `<span class="snum">${s.id}</span> <span class="sname">${s.name}</span> <span class="scount">(${count})</span>`;
    btn.onclick = () => { currentStage = s.id; selectedComp = null; render(); buildSidebar(); updateInfo(); };
    container.appendChild(btn);
  });
  updateInfo();
}

function updateInfo() {
  const info = document.getElementById('stage-info');
  if (!layout || !layout.stages) { info.innerHTML = ''; return; }
  const s = layout.stages.find(s => s.id === currentStage);
  if (!s) { info.innerHTML = ''; return; }
  const parts = [];
  if (layout.twoPins) layout.twoPins.filter(c => c.stage === s.id).forEach(c => parts.push(`${c.id} (${c.value})`));
  if (layout.ics) layout.ics.filter(c => c.stage === s.id).forEach(c => parts.push(`${c.id} (${c.value})`));
  if (layout.transistors) layout.transistors.filter(c => c.stage === s.id).forEach(c => parts.push(`${c.id} (${c.value} ${c.subtype})`));
  if (layout.jumpers) layout.jumpers.filter(c => c.stage === s.id).forEach(c => parts.push(`${c.id}: ${c.label}`));
  if (layout.powerWires) layout.powerWires.filter(c => c.stage === s.id).forEach(c => parts.push(`Wire: ${c.label}`));
  if (layout.jpsWires) layout.jpsWires.filter(c => c.stage === s.id).forEach(c => parts.push(`JPS ${c.id}: ${c.label}`));
  info.innerHTML = `<h3>Stage ${s.id}: ${s.name}</h3><div>${s.desc||''}</div><div class="test-point">Test: ${s.test||'—'}</div><div class="parts-list"><b>Parts:</b> ${parts.join(', ')}</div>`;
}

// ============================================================
// RENDERING
// ============================================================
function render() {
  svg.innerHTML = '';
  compGroups = [];
  if (!layout) { drawBoard(); return; }
  drawBoard();
  drawICs();
  drawTransistors();
  drawTwoPins();
  drawJumpers();
  drawPowerWires();
  if (document.getElementById('showJPS').checked) drawJPSWires();
  if (document.getElementById('showNets').checked) drawNetLabels();
}

function drawBoard() {
  svg.appendChild(el('rect', {x:0, y:0, width:SVG_W, height:SVG_H, fill:TH.page}));
  // Main area ends at row 36 on a powered board — there is no main-area row 37-40.
  const bx = colX('a')-14, by = rowY(1)-14, bw = colX('j')-colX('a')+28;
  const bh = rowY(MAIN_ROWS)-rowY(1)+28;
  svg.appendChild(el('rect', {x:bx, y:by, width:bw, height:bh, rx:4, fill:TH.board, stroke:TH.boardEdge, 'stroke-width':1}));
  svg.appendChild(el('text', {x:(colX('a')+colX('j'))/2, y:rowY(38.5), fill:TH.note, 'font-size':9, 'text-anchor':'middle', 'dominant-baseline':'middle'}, 'no main-area rows past 36 — connector + rail continue to 40'));

  // Stage color band
  if (layout && layout.stages && !document.getElementById('showAll').checked) {
    const s = layout.stages.find(s => s.id === currentStage);
    if (s) {
      let rows = new Set();
      const addRows = (arr, rKeys) => arr.filter(c => (c.stage||c[c.length-1]) === s.id).forEach(c => rKeys.forEach(k => { if (typeof c[k]==='number') rows.add(c[k]); }));
      if (layout.twoPins) layout.twoPins.filter(c=>c.stage===s.id).forEach(c => { rows.add(c.r1); rows.add(c.r2); });
      if (layout.ics) layout.ics.filter(c=>c.stage===s.id).forEach(c => c.pins.forEach(p => rows.add(p.r)));
      if (layout.transistors) layout.transistors.filter(c=>c.stage===s.id).forEach(c => { rows.add(c.eR); rows.add(c.bR); rows.add(c.cR); });
      if (layout.jumpers) layout.jumpers.filter(c=>c.stage===s.id).forEach(c => { rows.add(c.r1); rows.add(c.r2); });
      const arr = [...rows].filter(r => typeof r === 'number' && r > 0 && r <= 40);
      if (arr.length > 0) {
        svg.appendChild(el('rect', { x:bx, y:rowY(Math.min(...arr))-P/2, width:3, height:rowY(Math.max(...arr))-rowY(Math.min(...arr))+P, fill:s.color||TH.gnd, opacity:0.6, rx:1 }));
      }
    }
  }

  // Rails — n8synth alternating pattern: even rows = power, odd rows = GND
  const y1 = rowY(1)-10, y2 = rowY(40)+10;
  ['pwrL','pwrR'].forEach(c => {
    // Draw thin background strip
    svg.appendChild(el('rect', {x:colX(c)-4, y:y1, width:8, height:y2-y1, rx:2, fill:TH.railFill, stroke:TH.railEdge, 'stroke-width':0.3}));
    // Draw alternating colored dots per row
    for (let r = 1; r <= CONN_ROWS; r++) {
      const color = railColor(c, r);
      svg.appendChild(el('circle', {cx:colX(c), cy:rowY(r), r:3, fill:color, opacity:0.85}));
      // 37-38 hold the board's own 10uF+ conditioning electrolytics
      if (r === 37 || r === 38) svg.appendChild(el('circle', {cx:colX(c), cy:rowY(r), r:5,
        fill:'none', stroke:TH.note, 'stroke-width':1}));
    }
    // Column header labels
    const topLabel = c === 'pwrL' ? '+12V / GND' : '-12V / GND';
    svg.appendChild(el('text', {x:colX(c), y:y1-4, fill:TH.ink, 'font-size':7, 'text-anchor':'middle'}, topLabel));
  });

  // Control-board columns (n8synth) — outboard of the rails; panel/pot/jack connections
  [['ctrlLo','ctrlLi'], ['ctrlRi','ctrlRo']].forEach(pair => {
    const [c1, c2] = pair;
    const xa = Math.min(colX(c1), colX(c2)), xb = Math.max(colX(c1), colX(c2));
    // one strip spanning both holes — they are a single node
    svg.appendChild(el('rect', {x:xa-4, y:y1, width:(xb-xa)+8, height:y2-y1, rx:2,
      fill:TH.ctrlFill, stroke:TH.ctrlEdge, 'stroke-width':0.3}));
    for (let r = 1; r <= CONN_ROWS; r++) {
      // hairline joining the pair, to show they are one node
      svg.appendChild(el('line', {x1:colX(c1), y1:rowY(r), x2:colX(c2), y2:rowY(r),
        stroke:TH.ctrlLink, 'stroke-width':1}));
      pair.forEach(c => svg.appendChild(el('circle', {cx:colX(c), cy:rowY(r), r:3,
        fill:'none', stroke:TH.ctrlHole, 'stroke-width':1.1})));
    }
    pair.forEach(c => svg.appendChild(el('text', {x:colX(c), y:y1-4, fill:TH.ctrlLabel,
      'font-size':5, 'text-anchor':'middle'}, c.endsWith('o') ? 'out' : 'in')));
  });

  // Half-row bars and holes
  for (let r = 1; r <= CONN_ROWS; r++) {
    const y = rowY(r);
    if (r <= MAIN_ROWS) {
      svg.appendChild(el('rect', {x:colX('a')-6, y:y-5, width:colX('e')-colX('a')+12, height:10, rx:3, fill:TH.halfRow, opacity:0.9}));
      svg.appendChild(el('rect', {x:colX('f')-6, y:y-5, width:colX('j')-colX('f')+12, height:10, rx:3, fill:TH.halfRow, opacity:0.9}));
      HOLE_COLS.forEach(c => svg.appendChild(el('circle', {cx:colX(c), cy:y, r:3, fill:'none', stroke:TH.hole, 'stroke-width':0.8})));
    }
    const dim = r <= MAIN_ROWS ? TH.ink : TH.inkDim;
    svg.appendChild(el('text', {x:4, y, fill:dim, 'font-size':8, 'dominant-baseline':'middle'}, String(r)));
    svg.appendChild(el('text', {x:SVG_W-4, y, fill:dim, 'font-size':8, 'dominant-baseline':'middle', 'text-anchor':'end'}, String(r)));
  }
  HOLE_COLS.forEach(c => svg.appendChild(el('text', {x:colX(c), y:rowY(1)-18, fill:TH.ink, 'font-size':9, 'text-anchor':'middle'}, c)));
}

function netLabelKey(r, side) { return r + '|' + side; }

// Rows covered by an IC or socket body, with the body's outer edges. Row net labels
// use this to start OUTSIDE the part rather than running underneath it — the same
// clearance the IC's own pin labels already get.
const IC_LABEL_GAP = 14;   // matches the pin-label inset (pinX -/+ 22 vs body edge -/+ 8)
function icBodySpans() {
  const spans = new Map();
  if (!layout || !layout.ics) return spans;
  layout.ics.forEach(ic => {
    if (!ic.pins || !ic.pins.length) return;
    const rows = ic.pins.map(p => p.r);
    const xs = ic.pins.map(p => colX(p.c));
    const left = Math.min(...xs) - 8, right = Math.max(...xs) + 8;
    for (let r = Math.min(...rows); r <= Math.max(...rows); r++) {
      const cur = spans.get(r);
      spans.set(r, cur ? {left: Math.min(cur.left, left), right: Math.max(cur.right, right)}
                       : {left, right});
    }
  });
  return spans;
}

// Which nets are already shown as a row label, so drawICs can avoid repeating them.
function shownNetLabels() {
  const map = new Map();
  if (!layout || !layout.netLabels) return map;
  const showAll = document.getElementById('showAll').checked;
  layout.netLabels.forEach(nl => {
    if (!showAll && nl.stage > currentStage) return;
    const k = netLabelKey(nl.r, nl.side);
    if (!map.has(k)) map.set(k, new Set());
    map.get(k).add(nl.name);
  });
  return map;
}

function drawNetLabels() {
  if (!layout || !layout.netLabels) return;
  const showAll = document.getElementById('showAll').checked;
  // Group by row+side. A row half is ONE node, so several names on it are aliases
  // for the same node — join them rather than stacking them at identical coords.
  const groups = new Map();
  layout.netLabels.forEach(nl => {
    if (!showAll && nl.stage > currentStage) return;
    const k = netLabelKey(nl.r, nl.side);
    if (!groups.has(k)) groups.set(k, {r:nl.r, side:nl.side, names:[], stage:nl.stage});
    const g = groups.get(k);
    if (!g.names.includes(nl.name)) g.names.push(nl.name);
    g.stage = Math.min(g.stage, nl.stage);
  });
  const bodies = icBodySpans();
  groups.forEach(g => {
    const y = rowY(g.r) + NET_LABEL_DY;
    const opacity = (!showAll && g.stage < currentStage) ? 0.4 : 1;
    const onLeft = g.side === 'L';
    // Hug the gap by default; if a part covers this row, start outside it instead.
    const body = bodies.get(g.r);
    let x = onLeft ? colX('e') + 4 : colX('f') - 4;
    if (body) x = onLeft ? Math.min(x, body.left - IC_LABEL_GAP)
                         : Math.max(x, body.right + IC_LABEL_GAP);
    svg.appendChild(el('text', {
      x,
      y,
      fill: TH.netInk,
      'font-size': NET_LABEL_SIZE,
      'text-anchor': onLeft ? 'end' : 'start',
      'dominant-baseline': 'auto',
      opacity
    }, g.names.join(' / ')));
  });
}

function makeCG(id, type, value, stage) {
  const sinfo = layout.stages ? layout.stages.find(s => s.id === stage) : null;
  const g = el('g', {class:`comp-group ${stageClass(stage)}`, 'data-id':id, 'data-type':type, 'data-value':value, 'data-stage':stage, 'data-sname':sinfo?sinfo.name:''});
  compGroups.push(g);
  return g;
}

function drawTwoPins() {
  if (!layout || !layout.twoPins) return;
  const showVal = document.getElementById('showValues').checked;
  layout.twoPins.forEach(c => {
    const p1 = pinPos(c.r1, c.c1), p2 = pinPos(c.r2, c.c2);
    const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2, color = TYPE_COLORS[c.type];
    const isLong = Math.abs(c.r2-c.r1) >= 10;
    const g = makeCG(c.id, c.type, c.value, c.stage);
    g.appendChild(el('line', {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:color, 'stroke-width':isLong?1.5:2, 'stroke-dasharray':isLong?'4,3':'none', class:'comp-body', opacity:0.8}));
    if (c.type==='R') g.appendChild(el('rect', {x:mx-9, y:my-3.5, width:18, height:7, rx:2, fill:color, stroke:TH.rBody, 'stroke-width':0.5, class:'comp-body'}));
    else if (c.type==='C') g.appendChild(el('rect', {x:mx-7, y:my-5, width:14, height:10, rx:1, fill:color, stroke:TH.cBody, 'stroke-width':0.5, class:'comp-body'}));
    else if (c.type==='D') {
      const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/len, uy=dy/len, px=-uy, py=ux, sz=4;
      g.appendChild(el('path', {d:`M${mx+ux*sz},${my+uy*sz} L${mx+px*sz},${my+py*sz} L${mx-px*sz},${my-py*sz} Z`, fill:color, class:'comp-body'}));
      g.appendChild(el('line', {x1:mx+ux*sz-px*sz, y1:my+uy*sz-py*sz, x2:mx+ux*sz+px*sz, y2:my+uy*sz+py*sz, stroke:color, 'stroke-width':1.5}));
    }
    if (!RAIL_COLS.includes(c.c1)) g.appendChild(el('circle', {cx:p1.x, cy:p1.y, r:2.5, fill:color, opacity:0.9}));
    if (!RAIL_COLS.includes(c.c2)) g.appendChild(el('circle', {cx:p2.x, cy:p2.y, r:2.5, fill:color, opacity:0.9}));
    if (RAIL_COLS.includes(c.c1)) g.appendChild(el('circle', {cx:p1.x, cy:p1.y, r:2, fill:TYPE_COLORS[c.c1]||TH.labelDim, opacity:0.9}));
    if (RAIL_COLS.includes(c.c2)) g.appendChild(el('circle', {cx:p2.x, cy:p2.y, r:2, fill:TYPE_COLORS[c.c2]||TH.labelDim, opacity:0.9}));
    g.appendChild(el('text', {x:mx, y:my-6, fill:TH.labelInk, 'font-size':7.5, 'text-anchor':'middle', 'dominant-baseline':'auto', 'font-weight':'bold'}, c.id));
    if (showVal) g.appendChild(el('text', {x:mx, y:my+10, fill:TH.labelDim, 'font-size':6.5, 'text-anchor':'middle', 'dominant-baseline':'auto'}, c.value));
    svg.appendChild(g);
  });
}

const EMPTY_SET = new Set();
function drawICs() {
  const shownNets = shownNetLabels();
  if (!layout || !layout.ics) return;
  layout.ics.forEach(ic => {
    const g = makeCG(ic.id, 'IC', ic.value || ic.type || '', ic.stage);
    const icRows = ic.pins.map(p => p.r);
    const startY = rowY(Math.min(...icRows)), endY = rowY(Math.max(...icRows));
    // Body extent from actual pin columns — supports DIP (cols e+f) AND single-column SIP (col d or col g).
    const pinXs = ic.pins.map(p => colX(p.c));
    const lx = Math.min(...pinXs), rx = Math.max(...pinXs);
    g.appendChild(el('rect', {x:lx-8, y:startY-P/2+2, width:rx-lx+16, height:endY-startY+P-4, rx:2, fill:TH.icBody, stroke:TH.markStroke, 'stroke-width':1, class:'comp-body'}));
    // The notch marks the PIN 1 end. Derive it from the pins themselves rather than
    // a separate rotation field, so the marking can never disagree with the pinout —
    // a flipped part has pin 1 at the other end and must get its notch there.
    const p1 = ic.pins.find(p => p.n === 1);
    const pin1AtBottom = p1 ? (p1.r === Math.max(...icRows)) : (ic.rotation === 180);
    // Sit the notch ON the body edge at the pin-1 end, and curve it INTO the body so it
    // reads as an indent rather than a dome. sweep-flag 1 arcs through the top, 0 through
    // the bottom — so a top-edge notch needs 0 and a bottom-edge notch needs 1.
    const bodyTop = startY - P/2 + 2, bodyBottom = endY + P/2 - 2;
    const notchY = pin1AtBottom ? bodyBottom : bodyTop;
    const notchSweep = pin1AtBottom ? 1 : 0;
    g.appendChild(el('path', {d:`M${(lx+rx)/2-5},${notchY} A5,5 0 0,${notchSweep} ${(lx+rx)/2+5},${notchY}`, fill:'none', stroke:TH.markStroke, 'stroke-width':0.8}));
    g.appendChild(el('text', {x:(lx+rx)/2, y:(startY+endY)/2-3, fill:TH.labelStrong, 'font-size':8, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-weight':'bold'}, ic.id));
    g.appendChild(el('text', {x:(lx+rx)/2, y:(startY+endY)/2+6, fill:TH.labelInk, 'font-size':7, 'text-anchor':'middle', 'dominant-baseline':'middle'}, ic.value || ic.type || ''));
    // Pin label side: honor ic.labelSide override; otherwise infer from pin column (col e or d → left; col f or g → right).
    ic.pins.forEach(pin => {
      const x = colX(pin.c), y = rowY(pin.r);
      const overrideSide = ic.labelSide;
      const isLeft = overrideSide ? (overrideSide === 'left') : (pin.c === 'e' || pin.c === 'd');
      g.appendChild(el('circle', {cx:x, cy:y, r:2.5, fill:TH.labelDim}));
      g.appendChild(el('text', {x:isLeft?x-12:x+12, y:y+1, fill:TH.ink, 'font-size':7, 'text-anchor':'middle', 'dominant-baseline':'middle'}, String(pin.n)));
      if (document.getElementById('showNets').checked && pin.net &&
          !(shownNets.get(netLabelKey(pin.r, isLeft ? 'L' : 'R'))||EMPTY_SET).has(pin.net))
        g.appendChild(el('text', {x:isLeft?x-22:x+22, y:y+NET_LABEL_DY, fill:TH.netInk, 'font-size':NET_LABEL_SIZE, 'text-anchor':isLeft?'end':'start', 'dominant-baseline':'auto'}, pin.net));
    });
    svg.appendChild(g);
  });
}

function drawTransistors() {
  if (!layout || !layout.transistors) return;
  layout.transistors.forEach(t => {
    const color = TYPE_COLORS[t.subtype];
    const g = makeCG(t.id, t.subtype, t.value, t.stage);
    const ex=colX(t.eC), ey=rowY(t.eR), bx=colX(t.bC), by=rowY(t.bR), cx_=colX(t.cC), cy_=rowY(t.cR);
    g.appendChild(el('circle', {cx:bx, cy:by, r:8, fill:color, stroke:TH.boardEdge, 'stroke-width':0.5, class:'comp-body', opacity:0.7}));
    g.appendChild(el('line', {x1:bx, y1:by, x2:ex, y2:ey, stroke:color, 'stroke-width':1.5}));
    g.appendChild(el('line', {x1:bx, y1:by, x2:cx_, y2:cy_, stroke:color, 'stroke-width':1.5}));
    g.appendChild(el('circle', {cx:ex, cy:ey, r:2.5, fill:color}));
    g.appendChild(el('circle', {cx:bx, cy:by, r:2.5, fill:TH.labelStrong}));
    g.appendChild(el('circle', {cx:cx_, cy:cy_, r:2.5, fill:color}));
    const off=8;
    g.appendChild(el('text', {x:ex+(ex>bx?off:-off), y:ey+1, fill:TH.labelInk, 'font-size':6, 'text-anchor':ex>bx?'start':'end', 'dominant-baseline':'middle'}, 'E'));
    g.appendChild(el('text', {x:bx, y:by-10, fill:TH.labelInk, 'font-size':6, 'text-anchor':'middle', 'dominant-baseline':'auto'}, 'B'));
    g.appendChild(el('text', {x:cx_+(cx_>bx?off:-off), y:cy_+1, fill:TH.labelInk, 'font-size':6, 'text-anchor':cx_>bx?'start':'end', 'dominant-baseline':'middle'}, 'C'));
    g.appendChild(el('text', {x:bx-12, y:by+1, fill:TH.labelInk, 'font-size':7, 'text-anchor':'end', 'dominant-baseline':'middle', 'font-weight':'bold'}, t.id));
    if (document.getElementById('showValues').checked) g.appendChild(el('text', {x:bx-12, y:by+9, fill:TH.labelDim, 'font-size':6, 'text-anchor':'end', 'dominant-baseline':'auto'}, `${t.value} ${t.subtype}`));
    svg.appendChild(g);
  });
}

function drawJumpers() {
  if (!layout || !layout.jumpers) return;
  layout.jumpers.forEach(j => {
    const p1=pinPos(j.r1,j.c1), p2=pinPos(j.r2,j.c2), mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const g = makeCG(j.id, 'JW', j.label, j.stage);
    g.appendChild(el('line', {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:TYPE_COLORS.JW, 'stroke-width':1.5, 'stroke-dasharray':'6,3', class:'comp-body', opacity:0.8}));
    g.appendChild(el('circle', {cx:p1.x, cy:p1.y, r:2.5, fill:TYPE_COLORS.JW}));
    g.appendChild(el('circle', {cx:p2.x, cy:p2.y, r:2.5, fill:TYPE_COLORS.JW}));
    // No text on jumpers — the dashed line reads as a jumper on sight, and the id
    // and label are still on its hover tooltip via makeCG().
    svg.appendChild(g);
  });
}

function drawPowerWires() {
  if (!layout || !layout.powerWires) return;
  layout.powerWires.forEach(w => {
    const p1=pinPos(w.r1,w.c1), p2=pinPos(w.r2,w.c2);
    // Determine which end is the rail end, derive color from row parity
    const isC1Rail = ['pwrL','pwrR','+12v','gndL','gndR','-12v'].includes(w.c1);
    const isC2Rail = ['pwrL','pwrR','+12v','gndL','gndR','-12v'].includes(w.c2);
    const railEnd = isC2Rail ? w.c2 : w.c1;
    const railRow = isC2Rail ? w.r2 : w.r1;
    const color = railColor(railEnd, railRow);
    const g = makeCG(w.label, 'PWR', w.label, w.stage);
    g.appendChild(el('line', {x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:color, 'stroke-width':1.5, class:'comp-body', opacity:0.7}));
    g.appendChild(el('circle', {cx:p1.x, cy:p1.y, r:2, fill:color}));
    g.appendChild(el('circle', {cx:p2.x, cy:p2.y, r:2, fill:color}));
    svg.appendChild(g);
  });
}

function drawJPSWires() {
  if (!layout || !layout.jpsWires) return;
  layout.jpsWires.forEach(j => {
    const x=colX(j.col), y=rowY(j.row), isRight=RIGHT_COLS.includes(j.col)||j.col==='ctrlR';
    const g = makeCG(j.id, 'JPS', j.label, j.stage);
    const sz=4;
    const txt = j.lbl || `${j.id} ${j.label}`;
    let labelColor = TH.jpsInk;
    if (j.mark === 'gnd') {
      // green earth symbol — "tie this control hole to the d ground-plane"
      labelColor = TH.netInk;
      g.appendChild(el('line', {x1:x, y1:y-3, x2:x, y2:y+1, stroke:TH.netInk, 'stroke-width':1.3}));
      g.appendChild(el('line', {x1:x-4, y1:y+1.5, x2:x+4, y2:y+1.5, stroke:TH.netInk, 'stroke-width':1.3}));
      g.appendChild(el('line', {x1:x-2.5, y1:y+3.3, x2:x+2.5, y2:y+3.3, stroke:TH.netInk, 'stroke-width':1.3}));
      g.appendChild(el('line', {x1:x-1, y1:y+5, x2:x+1, y2:y+5, stroke:TH.netInk, 'stroke-width':1.3}));
    } else if (j.mark === 'link') {
      // grey loop — leg tied locally to the wiper (e.g. DEPTH CCW-shorted-to-wiper)
      labelColor = TH.jpsAlt;
      g.appendChild(el('circle', {cx:x, cy:y, r:sz, fill:'none', stroke:TH.markStroke, 'stroke-width':1}));
    } else {
      g.appendChild(el('path', {d:`M${x},${y-sz} L${x+sz},${y} L${x},${y+sz} L${x-sz},${y} Z`, fill:TYPE_COLORS.JPS, stroke:TH.markAlt, 'stroke-width':0.5, class:'comp-body', opacity:0.85}));
      g.appendChild(el('line', {x1:isRight?x+10:x-10, y1:y, x2:x+(isRight?sz:-sz), y2:y, stroke:TYPE_COLORS.JPS, 'stroke-width':1, opacity:0.6}));
    }
    g.appendChild(el('text', {x:isRight?x+8:x-8, y:y+1, fill:labelColor, 'font-size':6, 'text-anchor':isRight?'start':'end', 'dominant-baseline':'middle', opacity:0.9}, txt));
    svg.appendChild(g);
  });
}

// ============================================================
// TOOLTIP + INTERACTION
// ============================================================
const tooltip = document.getElementById('tooltip');
svg.addEventListener('mousemove', e => {
  const g = e.target.closest('.comp-group');
  if (g) {
    tooltip.innerHTML = `<span class="tt-id">${g.dataset.id}</span><br><span class="tt-val">${g.dataset.value}</span><br><span class="tt-net">${g.dataset.type}</span><br><span class="tt-stage">Stage ${g.dataset.stage}: ${g.dataset.sname}</span>`;
    tooltip.style.display = 'block'; tooltip.style.left = (e.clientX+14)+'px'; tooltip.style.top = (e.clientY-10)+'px';
  } else tooltip.style.display = 'none';
});
svg.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

svg.addEventListener('click', e => {
  const g = e.target.closest('.comp-group');
  if (g && selectedComp !== g) {
    selectedComp = g;
    compGroups.forEach(cg => {
      if (cg===g) { cg.classList.add('highlighted'); cg.classList.remove('dimmed','prior','current'); }
      else { cg.classList.add('dimmed'); cg.classList.remove('highlighted','prior','current'); }
    });
  } else {
    selectedComp = null;
    compGroups.forEach(cg => { const s=parseInt(cg.dataset.stage); cg.classList.remove('dimmed','highlighted','prior','current'); cg.classList.add(stageClass(s)); });
  }
});

// ============================================================
// CONTROLS
// ============================================================
['showNets','showValues','showJPS','showAll'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { selectedComp=null; render(); });
});
document.addEventListener('keydown', e => {
  if (!layout || !layout.stages) return;
  const max = layout.stages.length;
  if (e.key==='ArrowRight' && currentStage<max) { currentStage++; selectedComp=null; render(); buildSidebar(); }
  if (e.key==='ArrowLeft' && currentStage>1) { currentStage--; selectedComp=null; render(); buildSidebar(); }
});

// Theme toggle. Both palettes now pass contrast in both modes, so labels are no
// longer forced — but colour carries only 3 categories, so the shape and label are
// still what identify a specific component.
const lightBox = document.getElementById('lightMode');
const LEGEND = [
  ['R','R'], ['C','C'], ['D','D'], ['IC','IC'],
  ['NPN','NPN'], ['PNP','PNP'], ['JW','jump'], ['JPS','JPS'],
];
function drawLegend() {
  const box = document.getElementById('legend');
  box.innerHTML = LEGEND.map(([k, label]) =>
    `<div class="legend-item"><div class="legend-swatch" style="background:${TH.types[k]}"></div>${label}</div>`
  ).join('') +
  `<div class="legend-item"><div class="legend-swatch" style="background:${TH.pos}"></div>+12V</div>` +
  `<div class="legend-item"><div class="legend-swatch" style="background:${TH.neg}"></div>-12V</div>` +
  `<div class="legend-item"><div class="legend-swatch" style="background:${TH.gnd}"></div>GND</div>` +
  '<div class="legend-note">NPN and PNP are close in light mode — read the label to tell them apart</div>';
}
function applyTheme() {
  THEME = lightBox.checked ? 'light' : 'dark';
  TH = PALETTES[THEME];
  document.documentElement.setAttribute('data-theme', THEME);
  drawLegend();
  render();
}
lightBox.checked = (THEME === 'light');
lightBox.addEventListener('change', applyTheme);
applyTheme();
populateSelect();
drawBoard();

const firstBuiltin = Object.keys(BUILTIN_LAYOUTS)[0];
if (firstBuiltin) loadBuiltinLayout(firstBuiltin);
